<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katalog Kendaraan | Petahunan Rent Car</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#2563eb", // Blue-600
              primaryHover: "#1d4ed8", // Blue-700
            },
          },
        },
      };
    </script>
    <style>
      /* Global CSS */
      html {
        scroll-behavior: smooth;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #f8fafc; /* Slate 50 */
      }
      /* Custom Scrollbar untuk filter area jika meluap di mobile */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="text-slate-800">
    <nav class="bg-white shadow-sm sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex-shrink-0 font-bold text-xl text-primary">
            Petahunan Rent
          </div>
          <div class="hidden md:flex space-x-8">
            <a href="index.html" class="text-slate-500 hover:text-primary">Beranda</a>
            <a
              href="#"
              class="text-primary font-medium border-b-2 border-primary"
              >Katalog</a
            >
            <a href="#" class="text-slate-500 hover:text-primary"
              >Syarat & Ketentuan</a
            >
          </div>
          <div class="flex space-x-4">
            <button class="text-slate-600 hover:text-primary font-medium">
              Masuk
            </button>
            <button
              class="bg-primary text-white px-4 py-2 rounded-lg font-medium hover:bg-primaryHover transition"
            >
              Daftar
            </button>
          </div>
        </div>
      </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="mb-8">
        <h1 class="text-3xl font-bold text-slate-900 mb-2">
          Katalog Kendaraan
        </h1>
        <p class="text-slate-500">
          Pilih kendaraan terbaik untuk perjalanan Anda di Banyumas dan
          sekitarnya.
        </p>

        <div
          class="mt-4 bg-slate-200 w-full h-32 rounded-xl flex items-center justify-center border border-slate-300 relative overflow-hidden"
        >
          <span
            class="text-slate-500 font-medium z-10 bg-white/80 px-4 py-1 rounded shadow-sm"
            >Integrasi Google Maps Area Petahunan (Placeholder)</span
          >
        </div>
      </div>

      <div class="flex flex-col lg:flex-row gap-8">
        <aside class="w-full lg:w-1/4">
          <div
            class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 sticky top-24"
          >
            <h2 class="font-semibold text-lg mb-4">Filter Pencarian</h2>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-700 mb-2"
                >Jenis Kendaraan</label
              >
              <div class="space-y-2">
                <label class="flex items-center">
                  <input
                    type="checkbox"
                    class="rounded text-primary focus:ring-primary"
                    checked
                  />
                  <span class="ml-2 text-slate-600">MPV (Keluarga)</span>
                </label>
                <label class="flex items-center">
                  <input
                    type="checkbox"
                    class="rounded text-primary focus:ring-primary"
                  />
                  <span class="ml-2 text-slate-600">SUV (Tangguh)</span>
                </label>
                <label class="flex items-center">
                  <input
                    type="checkbox"
                    class="rounded text-primary focus:ring-primary"
                  />
                  <span class="ml-2 text-slate-600">City Car</span>
                </label>
              </div>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-700 mb-2"
                >Harga / Hari</label
              >
              <select
                class="w-full border-slate-300 rounded-lg shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border"
              >
                <option>Semua Harga</option>
                <option>< Rp 300.000</option>
                <option>Rp 300.000 - Rp 500.000</option>
                <option>> Rp 500.000</option>
              </select>
            </div>

            <div class="mb-6">
              <label class="block text-sm font-medium text-slate-700 mb-2"
                >Transmisi</label
              >
              <div class="flex gap-2">
                <button
                  class="flex-1 py-2 border border-primary bg-primary/10 text-primary rounded-lg font-medium text-sm"
                >
                  Manual
                </button>
                <button
                  class="flex-1 py-2 border border-slate-200 text-slate-600 rounded-lg font-medium text-sm hover:bg-slate-50"
                >
                  Matic
                </button>
              </div>
            </div>

            <button
              class="w-full bg-slate-900 text-white py-2 rounded-lg font-medium hover:bg-slate-800 transition"
            >
              Terapkan Filter
            </button>
          </div>
        </aside>
        <div class="w-full lg:w-3/4">
          <div
            id="catalog-grid"
            class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
          ></div>
        </div>
      </div>
    </main>
    <script>
      // Struktur data ini disiapkan untuk di-copy ke vehicles.json di Next.js nanti
      const vehicles = [
        {
          id: 1,
          name: "Toyota Avanza Veloz",
          type: "MPV",
          transmission: "Manual",
          pricePerDay: 350000,
          rating: 4.8,
          reviews: 24,
          status: "Tersedia",
          imageUrl:
            "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&q=80&w=400", // Placeholder image
        },
        {
          id: 2,
          name: "Mitsubishi Xpander",
          type: "MPV",
          transmission: "Matic",
          pricePerDay: 400000,
          rating: 4.9,
          reviews: 18,
          status: "Tersedia",
          imageUrl:
            "https://images.unsplash.com/photo-1550355291-bbee04a92027?auto=format&fit=crop&q=80&w=400",
        },
        {
          id: 3,
          name: "Honda Brio Satya",
          type: "City Car",
          transmission: "Manual",
          pricePerDay: 250000,
          rating: 4.7,
          reviews: 32,
          status: "Disewa",
          imageUrl:
            "https://images.unsplash.com/photo-1617531653332-bd46c24f2068?auto=format&fit=crop&q=80&w=400",
        },
        {
          id: 4,
          name: "Toyota Fortuner VRZ",
          type: "SUV",
          transmission: "Matic",
          pricePerDay: 800000,
          rating: 5.0,
          reviews: 12,
          status: "Tersedia",
          imageUrl:
            "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&q=80&w=400",
        },
      ];

      function formatRupiah(number) {
        return new Intl.NumberFormat("id-ID", {
          style: "currency",
          currency: "IDR",
          minimumFractionDigits: 0,
        }).format(number);
      }

      function renderCatalog() {
        const grid = document.getElementById("catalog-grid");
        grid.innerHTML = ""; // Kosongkan grid

        vehicles.forEach((vehicle) => {
          // Label status dinamis
          const statusBadge =
            vehicle.status === "Tersedia"
              ? `<span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-2 py-1 rounded-md">Tersedia</span>`
              : `<span class="bg-rose-100 text-rose-700 text-xs font-semibold px-2 py-1 rounded-md">Disewa</span>`;

          // Disable tombol jika disewa
          const btnClass =
            vehicle.status === "Tersedia"
              ? `bg-primary hover:bg-primaryHover text-white cursor-pointer`
              : `bg-slate-200 text-slate-400 cursor-not-allowed`;

          const btnText =
            vehicle.status === "Tersedia" ? "Lihat Detail" : "Tidak Tersedia";

          const cardHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col transition hover:shadow-md">
                        <div class="relative h-48 bg-slate-200">
                            <img src="${vehicle.imageUrl}" alt="${vehicle.name}" class="w-full h-full object-cover">
                            <div class="absolute top-3 right-3">
                                ${statusBadge}
                            </div>
                        </div>
                        
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <h3 class="text-lg font-bold text-slate-900">${vehicle.name}</h3>
                                    <p class="text-sm text-slate-500">${vehicle.type} • ${vehicle.transmission}</p>
                                </div>
                                <div class="flex items-center bg-amber-50 px-2 py-1 rounded text-sm">
                                    <span class="text-amber-500 mr-1">★</span>
                                    <span class="font-semibold text-slate-700">${vehicle.rating}</span>
                                </div>
                            </div>
                            
                            <div class="mt-4 mb-6">
                                <span class="text-xl font-bold text-slate-900">${formatRupiah(vehicle.pricePerDay)}</span>
                                <span class="text-sm text-slate-500">/ hari</span>
                            </div>
                            
                            <div class="mt-auto">
                                <button class="w-full py-2 rounded-lg font-medium transition ${btnClass}">
                                    ${btnText}
                                </button>
                            </div>s
                        </div>
                    </div>
                `;
          grid.innerHTML += cardHTML;
        });
      }

      // Render saat halaman dimuat
      document.addEventListener("DOMContentLoaded", renderCatalog);
    </script>
  </body>
</html>
